# ─────────────────────────────────────────────────────────────────────────────
# TKE CIS Audit Variables — Phase 1 (Section 1 only)
#
# Based on CIS.yml from RHEL9-CIS-Audit repo, customized for:
#   - Only Section 1 enabled (sections 2-7 disabled)
#   - TKE-specific exceptions applied
#   - Cloud image exceptions (no separate partitions, no bootloader password)
#
# USAGE:
#   ./run_audit.sh -v vars/tke-cis-phase1.yml -o /tmp/goss-results.json -g all
# ─────────────────────────────────────────────────────────────────────────────

## Metadata
benchmark_version: '2.0.0'
host_os_distribution: RedHat
timeout_ms: 120000
run_heavy_tests: true

